version: "3.8"

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: landslide_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  rag-service:
    build: ./rag-service
    ports:
      - "8000:8000"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      CHROMA_PERSIST_DIR: /app/chroma_db
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    volumes:
      - ./rag-service/chroma_db:/app/chroma_db
      - ./rag-service/knowledge:/app/knowledge

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_USERNAME: root
      DB_PASSWORD: mysql
      RAG_API_ASK_URL: http://rag-service:8000/ask
    depends_on:
      - mysql
      - rag-service

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mysql_data:
