version: "3.8"

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: mysql
      MYSQL_DATABASE: landslide_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  rag-service:
    build: ./rag-service
    ports:
      - "8000:8000"
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      FAISS_INDEX_DIR: /app/faiss_index
      HF_ENDPOINT: https://hf-mirror.com
      CORS_ORIGINS: http://localhost:5173,http://localhost:8080
    volumes:
      - ./rag-service/faiss_index:/app/faiss_index
      - ./rag-service/knowledge:/app/knowledge
      - hf_cache:/root/.cache/huggingface

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:mysql://mysql:3306/landslide_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      DB_USERNAME: root
      DB_PASSWORD: mysql
      RAG_API_ASK_URL: http://rag-service:8000/ask
      # LangChain chat runs outside compose on host:8001; set when using assistant:
      CHAT_API_CHAT_URL: http://host.docker.internal:8001/chat
    volumes:
      - ./backend/models:/app/models
    depends_on:
      - mysql
      - rag-service

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_TARGET: http://backend:8080
    depends_on:
      - backend

volumes:
  mysql_data:
  hf_cache:
